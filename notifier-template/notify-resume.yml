# Copy this file to `.github/workflows/notify-resume.yml` in any repository
# tagged with the `resume-project` topic. It notifies resume-core whenever
# the default branch is pushed to.
#
# IMPORTANT — this alone does NOT add the project to the resume. resume-core
# checks the source repo's topics and only processes the push if the repo
# ALSO has a `resume-ready` topic. Keep pushing/iterating freely with just
# `resume-project` — add `resume-ready` (Settings -> topic tags) once the
# project is actually presentable, then push again (or re-run the workflow)
# to have it appear on the resume.
#
# Required secret in THIS repo: RESUME_CORE_PAT
#   A fine-grained Personal Access Token scoped to trigger `repository_dispatch`
#   (Contents: read, Actions: write is NOT required — only the target repo's
#   "Contents: Read and write" permission for the dispatches endpoint) on the
#   resume-core repository. Set it under Settings -> Secrets and variables ->
#   Actions, or as an Organization secret shared across tracked repos.

name: Notify Resume Pipeline

on:
  push:
    branches: [main, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch resume_update event to resume-core
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RESUME_CORE_PAT }}
          repository: ChamathDilshanC/resume-core
          event-type: resume_update
          client-payload: |-
            {
              "repo_owner": "${{ github.repository_owner }}",
              "repo_name": "${{ github.event.repository.name }}"
            }
