name: Update Resume (Manual Work Experience)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: resume-core-update
  cancel-in-progress: false

jobs:
  update-work-experience:
    if: contains(github.event.issue.labels.*.name, 'work-experience')
    runs-on: ubuntu-latest
    env:
      RESUME_JSON_PATH: ${{ github.workspace }}/data/resume.json
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout resume-data (private)
        uses: actions/checkout@v4
        with:
          repository: ChamathDilshanC/resume-data
          token: ${{ secrets.RESUME_DATA_PAT }}
          ref: main
          path: data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Parse issue form body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/parse-issue.js

      - name: Generate AI resume bullet points
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PROMPT_MODE: work
        run: node scripts/generate-bullets.js

      - name: Merge work experience into resume.json
        run: node scripts/merge-work.js

      - name: Install Calibri-compatible font (Carlito)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Generate resume.pdf
        run: node generate-pdf.js

      - name: Commit and push resume.json (resume-data)
        env:
          COMMIT_MESSAGE: "feat: add ${{ env.ISSUE_POSITION }} at ${{ env.ISSUE_COMPANY }} to resume"
        run: bash scripts/commit-and-push.sh data resume.json

      - name: Upload resume.pdf to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: node scripts/upload-to-drive.js

      - name: Send resume.pdf via WhatsApp
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
        run: node scripts/send-whatsapp.js

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Resume updated and PDF regenerated. Closing this issue.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
