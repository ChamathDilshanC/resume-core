name: Regenerate Resume PDF

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-core-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout resume-data (private)
        uses: actions/checkout@v4
        with:
          repository: ChamathDilshanC/resume-data
          token: ${{ secrets.RESUME_DATA_PAT }}
          ref: main
          path: data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Calibri-compatible font (Carlito)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Generate resume.pdf
        env:
          RESUME_JSON_PATH: ${{ github.workspace }}/data/resume.json
        run: node generate-pdf.js

      - name: Upload resume.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
          retention-days: 1

  upload-to-drive:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        env:
          # This job only needs googleapis, not puppeteer's headless Chrome.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Upload resume.pdf to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: node scripts/upload-to-drive.js

  send-email:
    needs: upload-to-drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        env:
          # This job only needs nodemailer, not puppeteer's headless Chrome.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Send resume.pdf via email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: node scripts/send-email.js

  send-whatsapp:
    needs: send-email
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send resume.pdf via WhatsApp
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
        run: node scripts/send-whatsapp.js
