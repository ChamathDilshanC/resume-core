name: Regenerate Resume PDF

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-core-update
  cancel-in-progress: false

jobs:
  regenerate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout resume-data (private)
        uses: actions/checkout@v4
        with:
          repository: ChamathDilshanC/resume-data
          token: ${{ secrets.RESUME_DATA_PAT }}
          ref: main
          path: data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Calibri-compatible font (Carlito)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Generate resume.pdf
        env:
          RESUME_JSON_PATH: ${{ github.workspace }}/data/resume.json
        run: node generate-pdf.js

      - name: "TEMP DEBUG: list Drive files visible to service account"
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          node -e "
          const { google } = require('googleapis');
          (async () => {
            const creds = JSON.parse(process.env.GDRIVE_CREDENTIALS);
            console.log('service account email:', creds.client_email);
            console.log('project id:', creds.project_id);
            const auth = new google.auth.GoogleAuth({
              credentials: creds,
              scopes: ['https://www.googleapis.com/auth/drive.file'],
            });
            const drive = google.drive({ version: 'v3', auth });
            const res = await drive.files.list({ fields: 'files(id,name,mimeType)' });
            console.log('files visible to this service account:', JSON.stringify(res.data.files, null, 2));
          })().catch((e) => { console.error('debug list failed:', e.message); process.exit(1); });
          "

      - name: Upload resume.pdf to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: node scripts/upload-to-drive.js
