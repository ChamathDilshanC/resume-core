name: Regenerate Resume PDF

on:
  workflow_dispatch:
    inputs:
      delivery_image_paths:
        description: "Optional comma-separated image paths to deliver with the PDF"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: resume-core-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout resume-data (private)
        uses: actions/checkout@v4
        with:
          repository: ChamathDilshanC/resume-data
          token: ${{ secrets.RESUME_DATA_PAT }}
          ref: main
          path: data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Calibri-compatible font (Carlito)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Generate resume.pdf
        env:
          RESUME_JSON_PATH: ${{ github.workspace }}/data/resume.json
        run: node generate-pdf.js

      - name: Upload resume.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: |
            resume.pdf
            resume-name.txt
          retention-days: 1

  upload-to-drive:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        env:
          # This job only needs googleapis, not puppeteer's headless Chrome.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Upload resume.pdf to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: node scripts/upload-to-drive.js

  send-email:
    needs: upload-to-drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume-core
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        env:
          # This job only needs nodemailer, not puppeteer's headless Chrome.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Send resume.pdf via email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: node scripts/send-email.js

  send-telegram:
    name: Telegram Bot delivery
    needs: send-email
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram configuration
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" && -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram delivery skipped because TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are not configured."
          elif [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Telegram delivery requires both TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout resume-core
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send resume.pdf to Telegram
        if: steps.config.outputs.configured == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_IMAGE_PATHS: ${{ inputs.delivery_image_paths || vars.DELIVERY_IMAGE_PATHS }}
        run: node scripts/send-telegram.js

  send-discord:
    name: Discord webhook delivery
    needs: send-email
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord configuration
        id: config
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Discord delivery skipped because DISCORD_WEBHOOK_URL is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout resume-core
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download resume.pdf artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Setup Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send resume.pdf to Discord
        if: steps.config.outputs.configured == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DELIVERY_IMAGE_PATHS: ${{ inputs.delivery_image_paths || vars.DELIVERY_IMAGE_PATHS }}
          DISCORD_MAX_UPLOAD_BYTES: ${{ vars.DISCORD_MAX_UPLOAD_BYTES }}
        run: node scripts/send-discord.js
