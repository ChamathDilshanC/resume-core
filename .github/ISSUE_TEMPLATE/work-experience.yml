name: New Work Experience
description: Add a new work experience entry to the resume.
title: "[Work Experience] "
labels: ["work-experience"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the details below. The pipeline will turn your rough notes into
        polished, ATS-optimized resume bullet points and rebuild the PDF automatically.

  - type: input
    id: company
    attributes:
      label: Company
      description: Name of the company or organization.
      placeholder: "e.g. Applantics (PVT) Ltd"
    validations:
      required: true

  - type: input
    id: position
    attributes:
      label: Position
      description: Your job title.
      placeholder: "e.g. Software Engineering Intern"
    validations:
      required: true

  - type: input
    id: start-date
    attributes:
      label: Start Date
      description: "Format: YYYY-MM (leave blank if not applicable)."
      placeholder: "e.g. 2025-06"
    validations:
      required: false

  - type: input
    id: end-date
    attributes:
      label: End Date
      description: "Format: YYYY-MM, or 'Present'."
      placeholder: "e.g. Present"
    validations:
      required: false

  - type: textarea
    id: rough-description
    attributes:
      label: Rough Description
      description: Just describe what you did in plain language — the AI will professionalize it.
      placeholder: "e.g. I worked on live client projects, did debugging and backend integration..."
    validations:
      required: true
